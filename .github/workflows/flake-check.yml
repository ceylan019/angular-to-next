name: Flake check

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  flake:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [legacy, next]
        include:
          - target: legacy
            services: db backend legacy
          - target: next
            services: db backend web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: TEST_MODE=true docker compose up --build --wait ${{ matrix.services }}
      - run: pnpm --filter e2e exec playwright test --project=${{ matrix.target }} --repeat-each=10
      - if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flake-${{ matrix.target }}
          path: e2e/playwright-report
