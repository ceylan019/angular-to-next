name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend lint
      - run: pnpm --filter backend typecheck
      - run: pnpm --filter backend test:unit
      - run: pnpm --filter backend test:api
      - run: pnpm --filter backend mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-backend
          path: backend/reports/mutation

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BACKEND_URL: http://backend.test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-web
          path: web/coverage

  web-mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web mutation --concurrency 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-web
          path: web/reports/mutation

  legacy-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test -t legacy-test ./legacy
      - run: docker run --rm legacy-test

  legacy-mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target mutation -t legacy-mutation ./legacy
      - run: docker run --name legacy-mutation legacy-mutation
      - if: always()
        run: |
          mkdir -p legacy/reports
          docker cp legacy-mutation:/app/reports/mutation legacy/reports/mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-legacy
          path: legacy/reports/mutation

  e2e-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm --filter e2e test:unit

  e2e:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [legacy, next]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        include:
          - target: legacy
            services: db backend legacy
          - target: next
            services: db backend web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter e2e lint
      - run: pnpm --filter e2e typecheck
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: TEST_MODE=true docker compose up --build --wait ${{ matrix.services }}
      - run: pnpm --filter e2e exec playwright test --project=${{ matrix.target }}
      - if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-${{ matrix.target }}-${{ matrix.runner }}
          path: e2e/playwright-report

  traceability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter scripts lint
      - run: pnpm --filter scripts typecheck
      - run: pnpm --filter scripts test
      - run: pnpm --filter scripts mutation
      - run: pnpm traceability
      - run: git diff --exit-code docs/traceability.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-scripts
          path: scripts/reports/mutation
